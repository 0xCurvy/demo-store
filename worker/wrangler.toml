# Generated by Terraform from infra/: do not edit by hand. Run `terraform apply` in infra/ instead.
name = "brutalism-store"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
account_id = "08368d1ea7379694941c7064ccbcbce8"
workers_dev = false

# The built web app is served as static assets next to the Worker; the Worker answers /api, /download
# and the signer list, and falls back to index.html for the React pages.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/download/*", "/.well-known/*"]

[observability]
enabled = true

[env.development]
workers_dev = true
routes = [{ pattern = "dev.brutalism.store", custom_domain = true }]

[env.development.vars]
ENVIRONMENT = "development"
MERCHANT_ORIGIN = "https://dev.brutalism.store"

[[env.development.d1_databases]]
binding = "ORDERS"
database_name = "brutalism-store-development-orders"
database_id = "0d27e1a6-a9df-4d32-9797-060de88ba600"

[[env.development.r2_buckets]]
binding = "WALLPAPERS"
bucket_name = "brutalism-store-development-wallpapers"

# The reconciler: the background payment check the Node server ran on a timer.
[env.development.triggers]
crons = ["* * * * *"]

[env.production]
workers_dev = false
routes = [{ pattern = "brutalism.store", custom_domain = true }]

[env.production.vars]
ENVIRONMENT = "production"
MERCHANT_ORIGIN = "https://brutalism.store"

[[env.production.d1_databases]]
binding = "ORDERS"
database_name = "brutalism-store-production-orders"
database_id = "8a43db70-28f5-4a6d-8aba-8c608bd1aa9c"

[[env.production.r2_buckets]]
binding = "WALLPAPERS"
bucket_name = "brutalism-store-production-wallpapers"

# The reconciler: the background payment check the Node server ran on a timer.
[env.production.triggers]
crons = ["* * * * *"]
