CHAIN_ID = "42161"
AGGREGATOR_ADDRESS = "0xCfFcFD5b1e082b3924CD7dD34A49c99ef080f953"
TOKENS = "USDC"

[[env.development.d1_databases]]
binding = "ORDERS"
database_name = "brutalism-store-development-orders"
database_id = "0d27e1a6-a9df-4d32-9797-060de88ba600"

[[env.development.r2_buckets]]
binding = "WALLPAPERS"
bucket_name = "brutalism-store-development-wallpapers"

# The reconciler: the background payment check the Node server ran on a timer.
[env.development.triggers]
crons = ["* * * * *"]

[env.production]
